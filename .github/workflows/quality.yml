name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check shared perseus titan hermes clawdbot tests
      - name: Type check
        run: python -m mypy shared perseus titan hermes clawdbot
      - name: Test
        run: python -m pytest tests/ --ignore=tests/openjarvis -v
