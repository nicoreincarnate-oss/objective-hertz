name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check shared perseus titan hermes clawdbot openjarvis tests
      - name: Type check
        # OpenJarvis is excluded: it requires a compiled Rust extension
        # (openjarvis_rust) that needs maturin + Rust toolchain to build.
        # OpenJarvis type errors are suppressed via pyproject.toml overrides.
        run: python -m mypy shared perseus titan hermes clawdbot
      - name: Test
        # OpenJarvis tests excluded: 177 of them require openjarvis_rust
        # (Rust extension not compiled in CI). Remaining failures are
        # missing test fixtures and pre-existing framework issues.
        # Perseus product tests run in full.
        run: python -m pytest tests/ --ignore=tests/openjarvis -v
