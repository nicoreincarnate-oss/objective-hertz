[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "objective-hertz"
version = "0.1.0"
description = "OpenJarvis (Perseus) + Titan + Hermes + ClawdBot — autonomous AI revenue system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # OpenJarvis core
    "click>=8",
    "datasets>=4.5.0",
    "ddgs>=9.11.4",
    "httpx>=0.27",
    "openai>=1.30",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13",
    # Perseus daemons
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.1",
    "python-telegram-bot>=22.6",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.24.1",
    "sentry-sdk>=2.55.0",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.12.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.22",
    "ruff>=0.4",
    "pre-commit>=3.0",
]
inference-mlx = ["mlx-lm>=0.19; sys_platform == 'darwin'"]
inference-vllm = ["vllm>=0.16.0"]
inference-cloud = ["openai>=1.30", "anthropic>=0.30"]
memory-graph = ["neo4j>=5.0"]
inference-google = ["google-genai>=1.0"]
inference-litellm = ["litellm>=1.40"]
tools-search = ["tavily-python>=0.3", "ddgs>=9.11.4"]
memory-faiss = ["faiss-cpu>=1.7", "sentence-transformers>=2.2", "numpy>=1.24"]
memory-colbert = ["colbert-ai>=0.2", "torch>=2.0"]
memory-pdf = ["pdfplumber>=0.10"]
memory-bm25 = ["rank-bm25>=0.2.2"]
server = ["fastapi>=0.110", "uvicorn>=0.30", "pydantic>=2.0", "python-multipart>=0.0.9"]
gpu-metrics = ["pynvml>=12.0"]
energy-amd = ["amdsmi>=6.1"]
energy-apple = ["zeus-ml[apple]"]
orchestrator-training = ["torch>=2.0", "transformers>=4.40"]
learning-dspy = ["dspy>=2.6"]
channel-telegram = ["python-telegram-bot>=21.0"]
channel-discord = ["discord.py>=2.3"]
channel-slack = ["slack-sdk>=3.27"]
browser = ["playwright>=1.40"]
scheduler = ["croniter>=2.0"]
security-signing = ["cryptography>=43"]
sandbox-wasm = ["wasmtime>=25"]
sandbox-docker = ["docker>=7.0"]
speech = ["faster-whisper>=1.0"]
eval-wandb = ["wandb>=0.17"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.scripts]
jarvis = "openjarvis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openjarvis", "shared", "titan", "hermes", "clawdbot", "tools", "perseus", "conway", "ruflo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires running inference engine",
    "cloud: requires cloud API keys",
    "nvidia: requires NVIDIA GPU",
    "apple: requires Apple Silicon",
    "slow: long-running test",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tools/browser-use", "tools/firecrawl"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "B011", "B017", "E741", "B007", "B905", "F841"]

[tool.mypy]
python_version = "3.11"
packages = ["shared", "titan", "hermes", "clawdbot", "tools", "conway", "perseus"]
exclude = "(^tools/browser-use/|^tools/firecrawl/|^openjarvis/)"
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "openjarvis.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tools.firecrawl_client", "requests", "requests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "shared.observability"
ignore_errors = true

[dependency-groups]
dev = ["maturin>=1.12.6"]
