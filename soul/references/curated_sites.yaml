# Curated reference sites for ClawdBot v2 visual pipeline.
#
# These are the 30 reference sites whose screenshots seed the reference
# library. ReferenceManager captures each with Playwright, then VLM
# decomposes them into per-section crops stored under
# soul/references/{section_type}/{direction}.png.
#
# Edit this file to add/remove sites, then run:
#     python -m scripts.capture_references
version: 1
viewport:
  width: 1440
  height: 900

sites:
  # -------------------------------------------------------------------------
  # cosmos-dark-curation (8 sites) — dark canvas, premium SaaS, dense grids
  # -------------------------------------------------------------------------
