---
section_type: testimonials
variant: large-quote-spotlight
style_direction: [bold-editorial, fukuda-optical-precision, dark-cinematic]
complexity: low
cdn_deps: []
---
<section style="background-color: var(--color-bg); padding: var(--section-py) 0;">
  <div class="max-w-4xl mx-auto px-[var(--container-px)] text-center">
    <svg class="w-12 h-12 mx-auto mb-8 opacity-30" style="color: var(--color-accent);" fill="currentColor" viewBox="0 0 24 24"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10H14.017zM0 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151C7.546 6.068 5.983 8.789 5.983 11H10v10H0z"/></svg>
    <blockquote class="text-3xl md:text-4xl lg:text-5xl mb-8" style="font-family: var(--font-display); font-weight: var(--heading-weight); line-height: 1.2; color: var(--color-text);">
      "{{testimonial_quote}}"
    </blockquote>
    <div>
      <p class="text-base font-semibold" style="color: var(--color-text);">{{testimonial_name}}</p>
      <p class="text-sm" style="color: var(--color-text-muted);">{{testimonial_role}}, {{testimonial_company}}</p>
    </div>
  </div>
</section>
