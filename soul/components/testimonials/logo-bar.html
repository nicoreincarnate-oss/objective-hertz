---
section_type: testimonials
variant: logo-bar
style_direction: [minimal-geometric, bold-editorial, playful-animated, dark-cinematic, organic-illustrated]
complexity: low
cdn_deps: []
---
<section style="background-color: var(--color-surface); padding: 3rem 0;">
  <div class="max-w-[var(--container-max)] mx-auto px-[var(--container-px)]">
    <p class="text-center text-sm uppercase tracking-widest mb-8" style="color: var(--color-text-muted);">{{section_label}}</p>
    <div class="flex flex-wrap items-center justify-center gap-8 md:gap-16 opacity-50">
      <img src="{{logo_1_url}}" alt="{{logo_1_name}}" class="h-8 md:h-10 object-contain grayscale">
      <img src="{{logo_2_url}}" alt="{{logo_2_name}}" class="h-8 md:h-10 object-contain grayscale">
      <img src="{{logo_3_url}}" alt="{{logo_3_name}}" class="h-8 md:h-10 object-contain grayscale">
      <img src="{{logo_4_url}}" alt="{{logo_4_name}}" class="h-8 md:h-10 object-contain grayscale">
      <img src="{{logo_5_url}}" alt="{{logo_5_name}}" class="h-8 md:h-10 object-contain grayscale">
    </div>
  </div>
</section>
