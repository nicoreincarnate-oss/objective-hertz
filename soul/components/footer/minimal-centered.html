---
section_type: footer
variant: minimal-centered
style_direction: [minimal-geometric, arena-monastic-grid, fukuda-optical-precision, organic-illustrated]
complexity: low
cdn_deps: []
---
<footer style="background-color: var(--color-bg); border-top: 1px solid var(--color-text-muted); padding: 3rem 0;">
  <div class="max-w-[var(--container-max)] mx-auto px-[var(--container-px)] text-center">
    <h3 class="text-lg font-bold mb-4" style="font-family: var(--font-display); color: var(--color-text);">{{business_name}}</h3>
    <div class="flex justify-center gap-6 mb-6">
      <a href="#services" class="text-sm transition-colors hover:opacity-80" style="color: var(--color-text-secondary);">Services</a>
      <a href="#about" class="text-sm transition-colors hover:opacity-80" style="color: var(--color-text-secondary);">About</a>
      <a href="#contact" class="text-sm transition-colors hover:opacity-80" style="color: var(--color-text-secondary);">Contact</a>
    </div>
    <p class="text-sm mb-2" style="color: var(--color-text-muted);">{{address}}</p>
    <p class="text-sm mb-6" style="color: var(--color-text-muted);">{{phone}} | {{email}}</p>
    <p class="text-xs" style="color: var(--color-text-muted);">{{copyright}}</p>
  </div>
</footer>
