---
section_type: cta
variant: newsletter-minimal
style_direction: [minimal-geometric, arena-monastic-grid, organic-illustrated]
complexity: low
cdn_deps: []
---
<section style="background-color: var(--color-surface); padding: var(--section-py) 0;">
  <div class="max-w-xl mx-auto px-[var(--container-px)] text-center">
    <h2 class="text-3xl md:text-4xl mb-4" style="font-family: var(--font-display); font-weight: var(--heading-weight); line-height: var(--heading-lh); color: var(--color-text);">{{cta_headline}}</h2>
    <p class="text-base mb-8" style="color: var(--color-text-secondary); line-height: var(--body-lh);">{{cta_subheadline}}</p>
    <form class="flex flex-col sm:flex-row gap-3">
      <input type="email" placeholder="{{email_placeholder}}" class="flex-1 px-4 py-3 text-sm outline-none" style="background-color: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-text-muted); border-radius: var(--radius-sm);">
      <button type="submit" class="px-6 py-3 text-sm font-semibold text-white transition-all hover:opacity-90 whitespace-nowrap" style="background-color: var(--color-accent); border-radius: var(--radius-sm);">{{cta_button}}</button>
    </form>
    <p class="text-xs mt-3" style="color: var(--color-text-muted);">{{disclaimer}}</p>
  </div>
</section>
