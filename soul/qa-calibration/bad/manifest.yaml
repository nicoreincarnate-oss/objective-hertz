# Calibration dataset — BAD examples.
#
# Each entry references a PNG file (sibling to this manifest) of a
# known-low-quality section screenshot. Expected scores are 1-5 on
# the SectionScore 1-10 scale. Generate these by running the section
# engine with deliberately bad design tokens, overflow layouts, or
# placeholder-laden prompts.
version: 1
tier: bad
expected_score_range: [1.0, 5.0]
examples:
  - file: bad_hero_01.png
    section_type: hero
    expected_score: 3.0
    notes: "Placeholder Lorem Ipsum, wrong contrast, no hierarchy"
  - file: bad_hero_02.png
    section_type: hero
    expected_score: 2.5
    notes: "Layout overflow, text cut off at viewport edge"
  - file: bad_features_01.png
    section_type: features
    expected_score: 3.5
    notes: "Uneven column heights, inconsistent icons"
  - file: bad_features_02.png
    section_type: features
    expected_score: 2.0
    notes: "Broken grid, overlapping cards"
  - file: bad_testimonials_01.png
    section_type: testimonials
    expected_score: 3.0
    notes: "Default avatar placeholders, Lorem quotes"
  - file: bad_pricing_01.png
    section_type: pricing
    expected_score: 4.0
    notes: "Misaligned pricing rows, weak typography"
  - file: bad_pricing_02.png
    section_type: pricing
    expected_score: 2.5
    notes: "Missing CTA, broken spacing"
  - file: bad_cta_01.png
    section_type: cta
    expected_score: 3.0
    notes: "Weak contrast CTA, buried action"
  - file: bad_cta_02.png
    section_type: cta
