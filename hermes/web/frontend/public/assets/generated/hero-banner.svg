<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <radialGradient id="aurora1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#58e0ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58e0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="80%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#39f3e2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#39f3e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1085ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1085ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nexus" cx="50%" cy="60%" r="20%">
      <stop offset="0%" stop-color="#58e0ff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#39f3e2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#04080c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#58e0ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58e0ff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#39f3e2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#39f3e2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stream2" x1="100%" y1="30%" x2="0%" y2="70%">
      <stop offset="0%" stop-color="#1085ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#1085ff" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#58e0ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#58e0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#58e0ff" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1200" height="400" fill="#04080c"/>
  <!-- Aurora blobs -->
  <rect width="1200" height="400" fill="url(#aurora1)"/>
  <rect width="1200" height="400" fill="url(#aurora2)"/>
  <rect width="1200" height="400" fill="url(#aurora3)"/>
  <!-- Data nexus glow -->
  <rect width="1200" height="400" fill="url(#nexus)"/>
  <!-- Energy streams -->
  <path d="M0,200 Q300,150 600,210 T1200,180" stroke="url(#stream1)" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M0,250 Q400,300 700,230 T1200,260" stroke="url(#stream1)" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M1200,120 Q800,180 500,140 T0,170" stroke="url(#stream2)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Grid overlay -->
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.4"/>
  <!-- Floating data nodes -->
  <circle cx="200" cy="150" r="3" fill="#58e0ff" opacity="0.6"/>
  <circle cx="200" cy="150" r="8" fill="none" stroke="#58e0ff" stroke-opacity="0.2"/>
  <circle cx="450" cy="250" r="2.5" fill="#39f3e2" opacity="0.5"/>
  <circle cx="450" cy="250" r="7" fill="none" stroke="#39f3e2" stroke-opacity="0.15"/>
  <circle cx="700" cy="180" r="4" fill="#58e0ff" opacity="0.7"/>
  <circle cx="700" cy="180" r="10" fill="none" stroke="#58e0ff" stroke-opacity="0.25"/>
  <circle cx="950" cy="220" r="3" fill="#1085ff" opacity="0.5"/>
  <circle cx="950" cy="220" r="8" fill="none" stroke="#1085ff" stroke-opacity="0.2"/>
  <circle cx="600" cy="200" r="5" fill="#58e0ff" opacity="0.8"/>
  <circle cx="600" cy="200" r="15" fill="none" stroke="#58e0ff" stroke-opacity="0.15"/>
  <circle cx="600" cy="200" r="25" fill="none" stroke="#39f3e2" stroke-opacity="0.08"/>
  <!-- Connection lines between nodes -->
  <line x1="200" y1="150" x2="450" y2="250" stroke="#58e0ff" stroke-opacity="0.08" stroke-width="0.5"/>
  <line x1="450" y1="250" x2="700" y2="180" stroke="#39f3e2" stroke-opacity="0.08" stroke-width="0.5"/>
  <line x1="700" y1="180" x2="950" y2="220" stroke="#58e0ff" stroke-opacity="0.08" stroke-width="0.5"/>
  <line x1="200" y1="150" x2="600" y2="200" stroke="#1085ff" stroke-opacity="0.06" stroke-width="0.5"/>
  <line x1="600" y1="200" x2="950" y2="220" stroke="#1085ff" stroke-opacity="0.06" stroke-width="0.5"/>
</svg>
