<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#42c8e0" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Pencil body -->
    <path d="M20 6 L26 12 L12 26 L6 26 L6 20 Z" stroke-width="1.8"/>
    <!-- Pencil tip -->
    <path d="M6 20 L6 26 L12 26 L9 23 Z" fill="#42c8e0" stroke-width="0"/>
    <!-- Pencil diagonal line (wood/lead division) -->
    <line x1="10" y1="22" x2="20" y2="12" stroke-width="1"/>
    <!-- Pencil eraser end -->
    <line x1="22" y1="8" x2="24" y2="10" stroke-width="2.5"/>
    <!-- Writing lines (below pencil) -->
    <line x1="8" y1="20" x2="11" y2="17" stroke-width="1" stroke-opacity="0.4"/>
  </g>
</svg>
