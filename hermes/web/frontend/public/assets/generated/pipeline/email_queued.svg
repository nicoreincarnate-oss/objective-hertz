<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#39f3e2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Clock face -->
    <circle cx="16" cy="16" r="10" stroke-width="1.8"/>
    <!-- Hour hand (pointing ~10 o'clock) -->
    <line x1="16" y1="16" x2="11" y2="10" stroke-width="2"/>
    <!-- Minute hand (pointing ~2 o'clock) -->
    <line x1="16" y1="16" x2="21" y2="10" stroke-width="1.5"/>
    <!-- Center dot -->
    <circle cx="16" cy="16" r="1.2" fill="#39f3e2" stroke="none"/>
    <!-- Tick marks at 12, 3, 6, 9 -->
    <line x1="16" y1="7" x2="16" y2="9" stroke-width="1.5"/>
    <line x1="25" y1="16" x2="23" y2="16" stroke-width="1.5"/>
    <line x1="16" y1="25" x2="16" y2="23" stroke-width="1.5"/>
    <line x1="7" y1="16" x2="9" y2="16" stroke-width="1.5"/>
  </g>
</svg>
