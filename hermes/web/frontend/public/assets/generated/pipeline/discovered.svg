<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#58e0ff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Lens circle -->
    <circle cx="13" cy="13" r="7.5" stroke-width="2"/>
    <!-- Handle -->
    <line x1="18.5" y1="18.5" x2="25" y2="25" stroke-width="2.5"/>
    <!-- Inner cross-hairs (subtle) -->
    <line x1="10" y1="13" x2="16" y2="13" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="13" y1="10" x2="13" y2="16" stroke-width="1" stroke-opacity="0.5"/>
  </g>
</svg>
