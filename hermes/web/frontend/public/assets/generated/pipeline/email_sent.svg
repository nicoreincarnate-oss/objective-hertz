<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#39e0c8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Paper plane body -->
    <path d="M5 16 L27 6 L18 27 L14 19 Z" stroke-width="1.8"/>
