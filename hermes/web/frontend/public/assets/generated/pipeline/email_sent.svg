    <line x1="14" y1="19" x2="27" y2="6" stroke-width="1.2"/>
    <!-- Tail fin -->
    <path d="M14 19 L12 24 L17 21" stroke-width="1.2"/>
    <!-- Speed lines -->
    <line x1="4" y1="12" x2="8" y2="13" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="3" y1="16" x2="7" y2="16" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="4" y1="20" x2="8" y2="19" stroke-width="1" stroke-opacity="0.5"/>
  </g>
</svg>
