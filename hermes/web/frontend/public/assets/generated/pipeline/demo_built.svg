<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#7ef0a0" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Globe outer circle -->
    <circle cx="16" cy="16" r="10" stroke-width="1.8"/>
    <!-- Horizontal equator -->
    <ellipse cx="16" cy="16" rx="10" ry="4" stroke-width="1.2"/>
    <!-- Vertical meridian -->
    <line x1="16" y1="6" x2="16" y2="26" stroke-width="1.2"/>
    <!-- Latitude lines -->
    <path d="M7.5 11 Q16 13 24.5 11" stroke-width="0.9"/>
    <path d="M7.5 21 Q16 19 24.5 21" stroke-width="0.9"/>
    <!-- Stand base -->
    <line x1="16" y1="26" x2="16" y2="29" stroke-width="1.8"/>
    <line x1="12" y1="29" x2="20" y2="29" stroke-width="2"/>
  </g>
</svg>
