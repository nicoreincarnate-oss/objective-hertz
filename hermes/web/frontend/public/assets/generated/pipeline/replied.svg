<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#3fd8a0" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Reply arrow arc -->
    <path d="M22 10 Q26 10 26 14 L26 20 Q26 24 22 24 L12 24" stroke-width="2"/>
    <!-- Arrowhead pointing left -->
    <polyline points="16,20 11,24 16,28" stroke-width="2"/>
    <!-- Small dot to indicate message -->
    <circle cx="20" cy="17" r="1.5" fill="#3fd8a0" stroke="none"/>
    <circle cx="16" cy="17" r="1.5" fill="#3fd8a0" stroke="none"/>
    <circle cx="12" cy="17" r="1.5" fill="#3fd8a0" stroke="none" fill-opacity="0.5"/>
  </g>
</svg>
