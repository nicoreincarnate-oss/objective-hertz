<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#071510"/>
      <stop offset="100%" stop-color="#04080c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#62f1b5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#62f1b5" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#62f1b5" stroke-width="0.75" stroke-opacity="0.5"/>

  <!-- Glow halo -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Robot claw/hand icon -->
  <g filter="url(#blur-glow)" fill="none" stroke="#62f1b5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Palm base -->
    <path d="M22 38 Q20 36 20 32 L20 28 Q20 25 23 25 Q26 25 26 28 L26 33" stroke-width="2.5" fill="none"/>

    <!-- Finger 1 (index) -->
    <path d="M26 33 L26 19 Q26 16 29 16 Q32 16 32 19 L32 33" stroke-width="2.5" fill="none"/>

    <!-- Finger 2 (middle) -->
    <path d="M32 33 L32 17 Q32 14 35 14 Q38 14 38 17 L38 33" stroke-width="2.5" fill="none"/>

    <!-- Finger 3 (ring) -->
    <path d="M38 33 L38 20 Q38 17 41 17 Q44 17 44 20 L44 33" stroke-width="2.5" fill="none"/>

    <!-- Palm closing -->
    <path d="M44 33 Q44 36 44 38 Q44 42 40 44 L26 44 Q22 44 22 38" stroke-width="2.5" fill="none"/>

    <!-- Thumb -->
    <path d="M22 38 Q19 40 18 43 Q17 47 21 48 Q25 49 26 44" stroke-width="2" fill="none"/>

    <!-- Knuckle lines on fingers -->
    <line x1="26" y1="27" x2="32" y2="27" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="32" y1="26" x2="38" y2="26" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="38" y1="28" x2="44" y2="28" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Wrist circle accent -->
    <circle cx="32" cy="50" r="3" stroke-width="1.5" fill="#04080c"/>
  </g>
</svg>
