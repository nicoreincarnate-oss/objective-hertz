<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="100%" stop-color="#04080c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58e0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#58e0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#58e0ff" stroke-width="0.75" stroke-opacity="0.5"/>

  <!-- Glow halo -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Chess king silhouette (centered, scaled to fit ~40px height) -->
  <!-- Crown cross at top -->
  <g filter="url(#blur-glow)" fill="#58e0ff">
    <!-- Cross top -->
    <rect x="30.5" y="12" width="3" height="7" rx="0.5"/>
    <rect x="27.5" y="14.5" width="9" height="3" rx="0.5"/>

    <!-- Crown body with 3 points -->
    <path d="M22 21 L24.5 28 L27 23.5 L32 27 L37 23.5 L39.5 28 L42 21 Z"/>

    <!-- Crown band -->
    <rect x="22" y="28" width="20" height="2.5" rx="0.5"/>

    <!-- Neck taper -->
    <path d="M25 30.5 L27 35 L37 35 L39 30.5 Z"/>

    <!-- Base pedestal -->
    <rect x="24" y="35" width="16" height="2.5" rx="0.5"/>
    <rect x="21" y="37.5" width="22" height="3" rx="0.5"/>
    <rect x="19" y="40.5" width="26" height="3.5" rx="1"/>
  </g>
</svg>
