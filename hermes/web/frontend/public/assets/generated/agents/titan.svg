<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#071512"/>
      <stop offset="100%" stop-color="#04080c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39f3e2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#39f3e2" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#39f3e2" stroke-width="0.75" stroke-opacity="0.5"/>

  <!-- Glow halo -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Gear icon -->
  <g filter="url(#blur-glow)" fill="#39f3e2">
    <!-- Gear teeth (8 teeth) via path -->
    <path d="
      M32 14
      L34.2 14.4 L35.5 11.5 L38.5 12.8 L37.8 15.8
      L39.8 17.2 L42.5 15.5 L44.8 18 L43 20.5
      L44.4 22.8 L47.5 22.2 L48.5 25.5 L45.5 26.5
      L46 29 L49.2 30 L49 33.5 L45.8 34.2
      L45.5 36.8 L48.2 38.5 L46.8 41.5 L43.8 40.8
      L42 42.8 L43.5 45.5 L41 47.5 L38.5 45.8
      L36.2 47 L36.5 50.2 L33 50.5 L32.2 47.5
      L29.8 47.2 L28.5 50 L25.5 48.8 L26.2 45.8
      L24.2 44.2 L21.5 45.8 L19.2 43.2 L21 40.5
      L19.5 38.2 L16.5 38.8 L15.5 35.5 L18.5 34.5
      L18 32 L14.8 31 L15 27.5 L18.2 26.8
      L18.5 24.2 L15.8 22.5 L17.2 19.5 L20.2 20.2
      L22 18.2 L20.5 15.5 L23 13.5 L25.5 15.2
      L27.8 14 L27.5 10.8 L31 10.5 Z"
      fill-rule="evenodd"
    />
    <!-- Gear inner circle (hole) -->
    <circle cx="32" cy="32" r="10" fill="#04080c"/>
    <!-- Inner ring accent -->
    <circle cx="32" cy="32" r="10" fill="none" stroke="#39f3e2" stroke-width="1.5"/>
    <!-- Center dot -->
    <circle cx="32" cy="32" r="3" fill="#39f3e2"/>
  </g>
</svg>
