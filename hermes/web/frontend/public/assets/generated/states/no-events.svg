<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <style>
      .muted { opacity: 0.25; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
    </style>
  </defs>

  <!-- Signal wave container area -->
  <g class="muted">
    <!-- Flat baseline (flatline) -->
    <line x1="20" y1="72" x2="180" y2="72" stroke="#39f3e2" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left partial wave (faded, implying past activity) -->
    <path d="M20 72 Q30 72 35 72 Q40 72 45 52 Q50 32 55 72 Q60 112 65 72 Q70 32 72 72 L80 72" fill="none" stroke="#39f3e2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <!-- Right side — dead flat -->
    <line x1="80" y1="72" x2="180" y2="72" stroke="#39f3e2" stroke-width="1.5"/>

    <!-- Small dot at transition point -->
    <circle cx="80" cy="72" r="2.5" fill="#39f3e2" opacity="0.5"/>

    <!-- Subtle grid lines -->
    <line x1="20" y1="50" x2="180" y2="50" stroke="#39f3e2" stroke-width="0.5" stroke-dasharray="3 6" opacity="0.3"/>
    <line x1="20" y1="94" x2="180" y2="94" stroke="#39f3e2" stroke-width="0.5" stroke-dasharray="3 6" opacity="0.3"/>

    <!-- Vertical axis marks -->
    <line x1="20" y1="46" x2="20" y2="98" stroke="#39f3e2" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Label -->
  <text x="100" y="124" text-anchor="middle" font-size="11" fill="#39f3e2" class="label muted" letter-spacing="2">NO EVENTS</text>
  <text x="100" y="139" text-anchor="middle" font-size="9" fill="#39f3e2" class="label" opacity="0.15">Waiting for activity</text>
</svg>
