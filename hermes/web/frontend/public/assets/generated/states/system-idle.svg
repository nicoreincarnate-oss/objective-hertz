<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <style>
      .muted { opacity: 0.25; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
    </style>
  </defs>

  <!-- Slow idle pulse line -->
  <g class="muted">
    <!-- Background track -->
    <line x1="16" y1="72" x2="184" y2="72" stroke="#62f1b5" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.4"/>

    <!-- Slow, shallow heartbeat-style pulse -->
    <path d="
      M16 72
      L50 72
      Q55 72 57 68
      Q62 58 67 72
      Q70 80 73 72
      L110 72
      Q115 72 117 68
      Q122 58 127 72
      Q130 80 133 72
      L184 72
    " fill="none" stroke="#62f1b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Zzz dots indicating sleep -->
    <text x="128" y="50" font-size="9" fill="#62f1b5" font-family="monospace" opacity="0.5">z</text>
    <text x="136" y="43" font-size="10" fill="#62f1b5" font-family="monospace" opacity="0.4">z</text>
    <text x="145" y="35" font-size="11" fill="#62f1b5" font-family="monospace" opacity="0.3">z</text>
  </g>

  <!-- Label -->
  <text x="100" y="106" text-anchor="middle" font-size="11" fill="#62f1b5" class="label muted" letter-spacing="2">SYSTEM IDLE</text>
  <text x="100" y="121" text-anchor="middle" font-size="9" fill="#62f1b5" class="label" opacity="0.15">Daemons are resting</text>
</svg>
