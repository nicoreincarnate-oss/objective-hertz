<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <style>
      .muted { opacity: 0.25; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
    </style>
  </defs>

  <g class="muted">
    <!-- Magnifying glass lens -->
    <circle cx="90" cy="68" r="32" fill="none" stroke="#ffb347" stroke-width="1.8"/>

    <!-- Lens inner circle (depth) -->
    <circle cx="90" cy="68" r="24" fill="none" stroke="#ffb347" stroke-width="0.8" opacity="0.4"/>

    <!-- Handle -->
    <line x1="114" y1="92" x2="136" y2="114" stroke="#ffb347" stroke-width="3" stroke-linecap="round"/>

    <!-- X mark inside lens (no results) -->
    <line x1="79" y1="57" x2="101" y2="79" stroke="#ffb347" stroke-width="2" stroke-linecap="round"/>
    <line x1="101" y1="57" x2="79" y2="79" stroke="#ffb347" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Label -->
  <text x="100" y="136" text-anchor="middle" font-size="11" fill="#ffb347" class="label muted" letter-spacing="2">NO RESULTS</text>
  <text x="100" y="151" text-anchor="middle" font-size="9" fill="#ffb347" class="label" opacity="0.15">Try a different query</text>
</svg>
