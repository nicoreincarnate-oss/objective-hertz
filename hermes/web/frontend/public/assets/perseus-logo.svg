<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="trident-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58e0ff"/>
      <stop offset="50%" stop-color="#39f3e2"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="crown-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" stroke="url(#trident-grad)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="32" cy="32" r="26" stroke="url(#trident-grad)" stroke-width="0.5" opacity="0.15"/>

  <!-- Trident — central shaft -->
  <line x1="32" y1="18" x2="32" y2="50" stroke="url(#trident-grad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Trident — center prong tip -->
  <polygon points="32,12 29.5,18 34.5,18" fill="url(#trident-grad)" filter="url(#glow)"/>

  <!-- Trident — left prong -->
  <path d="M32 24 L22 18" stroke="url(#trident-grad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="20,13 19.5,19 24,17.5" fill="url(#trident-grad)" filter="url(#glow)"/>

  <!-- Trident — right prong -->
  <path d="M32 24 L42 18" stroke="url(#trident-grad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="44,13 44.5,19 40,17.5" fill="url(#trident-grad)" filter="url(#glow)"/>

  <!-- Crossbar -->
  <line x1="26" y1="28" x2="38" y2="28" stroke="url(#trident-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Crown accent — 3 small gold dots above trident -->
  <circle cx="27" cy="10" r="1.2" fill="url(#crown-grad)" opacity="0.7"/>
  <circle cx="32" cy="8" r="1.5" fill="url(#crown-grad)" opacity="0.9"/>
  <circle cx="37" cy="10" r="1.2" fill="url(#crown-grad)" opacity="0.7"/>

  <!-- Base waves — sea motif -->
  <path d="M20 48 Q24 45 28 48 Q32 51 36 48 Q40 45 44 48" stroke="#58e0ff" stroke-width="1" fill="none" opacity="0.25"/>
  <path d="M22 51 Q26 48.5 30 51 Q34 53.5 38 51 Q42 48.5 44 51" stroke="#39f3e2" stroke-width="0.8" fill="none" opacity="0.15"/>
</svg>
